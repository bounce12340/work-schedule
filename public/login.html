<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>
  // 與 index.html 共用同一個偏好鍵，主畫面切成暗色後，登入／管理頁不會突然閃回亮色。
  (function(){
    var pref = null;
    try{ pref = localStorage.getItem('workSchedule.v1.theme'); }catch(e){}
    var dark = (pref === 'dark') || (pref !== 'light' &&
      window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<title>登入 — 工作排程確認系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://challenges.cloudflare.com">
<!-- 字型不阻擋首次繪製，理由同 index.html：display=swap 已在網址內，
     擋住首次繪製換不到任何東西。登入頁尤其該快——它是所有人的第一個畫面。 -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"></noscript>
<style>
  :root{
    --bg:#F6F4EE; --panel:#FFFFFF; --panel-2:#F1EEE5;
    --hairline:#E4E0D3; --text:#2A2A26; --text-muted:#71706A; --text-dim:#A2A099;
    --amber:#C9822E; --amber-dim:rgba(201,130,46,0.12);
    --teal:#1F8C68; --teal-dim:rgba(31,140,104,0.10);
    --red:#C74B43; --red-dim:rgba(199,75,67,0.10);
    --on-accent:#FFFDF9;
    --mono:'JetBrains Mono',monospace; --sans:'Noto Sans TC','Inter',sans-serif;
  }

  /* 暗色版：只覆寫變數，元件樣式不動。<html data-theme> 由 <head> 的開機腳本先寫好。 */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1A1917; --panel:#232220; --panel-2:#2B2A27;
    --hairline:#3A3833; --hairline-soft:#322F2B;
    --text:#E8E5DC; --text-muted:#A8A49A; --text-dim:#7A766D;
    --on-accent:#17160F;
    --amber:#E3A052; --amber-dim:rgba(227,160,82,0.16);
    --teal:#3FBF92; --teal-dim:rgba(63,191,146,0.14);
    --red:#E8756B; --red-dim:rgba(232,117,107,0.14);
    --violet:#9B8CF5; --violet-dim:rgba(155,140,245,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--sans);
       display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--hairline);
        border-radius:16px;padding:32px 28px;}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--text-dim);
           text-transform:uppercase;margin-bottom:6px;}
  h1{margin:0 0 24px;font-size:21px;font-weight:700;letter-spacing:.01em;}
  .tabs{display:flex;gap:6px;background:var(--panel-2);border-radius:10px;padding:4px;margin-bottom:22px;}
  .tab{flex:1;padding:9px 0;border:none;background:transparent;border-radius:7px;cursor:pointer;
       font-family:var(--mono);font-size:12.5px;color:var(--text-muted);}
  .tab.active{background:var(--panel);color:var(--amber);font-weight:600;
              box-shadow:0 0 0 1px var(--hairline) inset;}
  .field{margin-bottom:15px;}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
        color:var(--text-muted);margin-bottom:6px;}
  input{width:100%;padding:11px 12px;border:1px solid var(--hairline);border-radius:8px;
        background:var(--panel-2);color:var(--text);font-family:var(--sans);font-size:14px;}
  input:focus{outline:none;border-color:var(--amber);background:var(--panel);}
  .hint{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:5px;}
  #tsBox{margin:18px 0 14px;min-height:65px;display:flex;justify-content:center;}
  button.submit{width:100%;padding:12px;border:none;border-radius:9px;background:var(--amber);
                color:var(--on-accent);font-family:var(--sans);font-size:14.5px;font-weight:700;cursor:pointer;}
  button.submit:disabled{background:var(--text-dim);cursor:not-allowed;}
  .msg{margin-top:16px;padding:11px 13px;border-radius:8px;font-size:13px;line-height:1.65;display:none;}
  .msg.err{display:block;background:var(--red-dim);border:1px solid rgba(199,75,67,.3);color:var(--red);}
  .msg.ok{display:block;background:var(--teal-dim);border:1px solid rgba(31,140,104,.3);color:var(--teal);}
  .foot{margin-top:22px;text-align:center;font-family:var(--mono);font-size:10.5px;
        color:var(--text-dim);line-height:1.8;}
  .foot .signature{display:inline-block;margin-top:8px;padding-top:8px;border-top:1px solid var(--hairline);
        font-family:var(--sans);font-size:11px;color:var(--text-muted);letter-spacing:.03em;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Schedule Control Board</div>
  <h1>工作排程確認系統</h1>

  <div class="tabs">
    <button class="tab active" id="tabLogin" type="button">登入</button>
    <button class="tab" id="tabRegister" type="button">註冊</button>
  </div>

  <form id="form" autocomplete="on">
    <div class="field">
      <label for="email">EMAIL</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">密碼</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <div class="hint" id="pwHint" style="display:none;">至少 10 個字元</div>
    </div>

    <div id="tsBox"></div>

    <button class="submit" id="submitBtn" type="submit" disabled>請稍候…</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="foot">
    註冊後需經管理者核准才能使用<br>
    本頁受 Cloudflare Turnstile 保護<br>
    <span class="signature">此系統由劉思妤設計、規劃、製作。</span>
  </div>
</div>

<script>
(function(){
  // 正式 sitekey 產生的 token 只有正式 secret 收，測試 secret 只收測試 token，
  // 因此本機開發必須換成官方測試 key，否則登入永遠過不了真人驗證。
  var isLocal = ['localhost','127.0.0.1'].indexOf(location.hostname) >= 0;
  var SITEKEY = isLocal ? '1x00000000000000000000AA' : '0x4AAAAAAEAkXN86cczJTf84';

  var mode = 'login';
  var widgetId = null;
  var tsToken = '';

  var form = document.getElementById('form');
  var emailEl = document.getElementById('email');
  var pwEl = document.getElementById('password');
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  var pwHint = document.getElementById('pwHint');

  function setMode(next){
    mode = next;
    document.getElementById('tabLogin').classList.toggle('active', mode==='login');
    document.getElementById('tabRegister').classList.toggle('active', mode==='register');
    pwEl.setAttribute('autocomplete', mode==='login' ? 'current-password' : 'new-password');
    pwHint.style.display = mode==='register' ? 'block' : 'none';
    btn.textContent = mode==='login' ? '登入' : '註冊';
    hideMsg();
    // 每個 token 只能用一次，切換表單後必須重取，否則送出會被判定 token 已使用
    if (widgetId !== null && window.turnstile) { tsToken=''; btn.disabled=true; turnstile.reset(widgetId); }
  }
  document.getElementById('tabLogin').onclick = function(){ setMode('login'); };
  document.getElementById('tabRegister').onclick = function(){ setMode('register'); };

  function showMsg(text, kind){ msg.textContent = text; msg.className = 'msg ' + kind; }
  function hideMsg(){ msg.className = 'msg'; msg.textContent = ''; }

  window.onTurnstileLoad = function(){
    widgetId = turnstile.render('#tsBox', {
      sitekey: SITEKEY,
      callback: function(token){ tsToken = token; btn.disabled = false; btn.textContent = mode==='login' ? '登入' : '註冊'; },
      'expired-callback': function(){ tsToken=''; btn.disabled=true; btn.textContent='驗證已過期，請重試'; },
      'error-callback': function(){ tsToken=''; btn.disabled=true; btn.textContent='驗證載入失敗'; }
    });
  };

  form.onsubmit = async function(e){
    e.preventDefault();
    if (!tsToken) { showMsg('請先完成真人驗證', 'err'); return; }
    var email = emailEl.value.trim();
    var password = pwEl.value;
    if (mode==='register' && password.length < 10) { showMsg('密碼至少需要 10 個字元', 'err'); return; }

    btn.disabled = true;
    btn.textContent = '處理中…';
    hideMsg();

    try {
      var res = await fetch('/api/auth/' + mode, {
        method:'POST',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({ email: email, password: password, turnstileToken: tsToken })
      });
      var data = await res.json().catch(function(){ return {}; });

      if (res.ok) {
        if (mode==='login') { location.href = '/'; return; }
        showMsg(data.message || '註冊成功', 'ok');
        if (data.status === 'approved') setMode('login');
        else form.reset();
      } else {
        // 回應不是 JSON 時（例如 Worker 丟例外，Cloudflare 直接回一頁 HTML 錯誤頁）
        // data 會是空物件。此時至少要把狀態碼顯示出來，否則畫面上看不出任何線索。
        showMsg(data.error
          ? data.error + (data.ref ? '（代碼 ' + data.ref + '）' : '')
          : '伺服器發生錯誤（HTTP ' + res.status + '），請稍後再試', 'err');
      }
    } catch (err) {
      showMsg('無法連線到伺服器，請檢查網路後再試', 'err');
    }

    // token 用過即失效，無論成敗都要換一張新的
    tsToken = '';
    btn.disabled = true;
    btn.textContent = '請稍候…';
    if (widgetId !== null && window.turnstile) turnstile.reset(widgetId);
  };
})();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" defer></script>
</body>
</html>
