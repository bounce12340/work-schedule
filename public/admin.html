<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>
  // 與 index.html 共用同一個偏好鍵，主畫面切成暗色後，登入／管理頁不會突然閃回亮色。
  (function(){
    var pref = null;
    try{ pref = localStorage.getItem('workSchedule.v1.theme'); }catch(e){}
    var dark = (pref === 'dark') || (pref !== 'light' &&
      window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<title>帳號管理 — 工作排程確認系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字型不阻擋首次繪製，理由同 index.html -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;600&display=swap"></noscript>
<style>
  :root{
    --bg:#F6F4EE; --panel:#FFFFFF; --panel-2:#F1EEE5;
    --hairline:#E4E0D3; --hairline-soft:#ECE8DD;
    --text:#2A2A26; --text-muted:#71706A; --text-dim:#A2A099;
    --amber:#C9822E; --amber-dim:rgba(201,130,46,0.12);
    --teal:#1F8C68; --teal-dim:rgba(31,140,104,0.10);
    --red:#C74B43; --red-dim:rgba(199,75,67,0.10);
    --violet:#6C5CE0; --violet-dim:rgba(108,92,224,0.10);
    --on-accent:#FFFDF9;
    --mono:'JetBrains Mono',monospace; --sans:'Noto Sans TC','Inter',sans-serif;
    --serif:'Noto Serif TC','Songti TC','Source Han Serif TC',serif;
  }

  /* 暗色版：只覆寫變數，元件樣式不動。<html data-theme> 由 <head> 的開機腳本先寫好。 */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1A1917; --panel:#232220; --panel-2:#2B2A27;
    --hairline:#3A3833; --hairline-soft:#322F2B;
    --text:#E8E5DC; --text-muted:#A8A49A; --text-dim:#7A766D;
    --on-accent:#17160F;
    --amber:#E3A052; --amber-dim:rgba(227,160,82,0.16);
    --teal:#3FBF92; --teal-dim:rgba(63,191,146,0.14);
    --red:#E8756B; --red-dim:rgba(232,117,107,0.14);
    --violet:#9B8CF5; --violet-dim:rgba(155,140,245,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);padding:28px 20px;}
  .signature{margin-top:26px;padding-top:14px;border-top:1px solid var(--hairline);text-align:center;
        font-family:var(--sans);font-size:11.5px;color:var(--text-muted);letter-spacing:.03em;}
  .wrap{max-width:940px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
         flex-wrap:wrap;margin-bottom:24px;}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--text-dim);
           text-transform:uppercase;margin-bottom:5px;}
  h1{margin:0;font-size:22px;font-weight:700;}
  .actions{display:flex;gap:10px;align-items:center;}
  .btn{font-family:var(--mono);font-size:12px;padding:8px 13px;border-radius:8px;cursor:pointer;
       border:1px solid var(--hairline);background:var(--panel);color:var(--text-muted);}
  .btn:hover{border-color:var(--amber);color:var(--amber);}
  .whoami{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .note{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:var(--panel-2);
        border:1px solid var(--hairline);border-radius:8px;padding:10px 12px;margin-bottom:18px;line-height:1.8;}
  .section-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);
                 text-transform:uppercase;margin:22px 0 10px;}
  .row{background:var(--panel);border:1px solid var(--hairline);border-radius:11px;padding:13px 15px;
       margin-bottom:9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .row.pending{border-color:rgba(201,130,46,.45);background:#FFFDF8;}
  .email{font-weight:500;font-size:14px;flex:1;min-width:190px;word-break:break-all;}
  .badge{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:5px;letter-spacing:.04em;}
  .badge.admin{background:var(--violet-dim);color:var(--violet);}
  .badge.user{background:var(--panel-2);color:var(--text-muted);}
  .badge.approved{background:var(--teal-dim);color:var(--teal);}
  .badge.pending{background:var(--amber-dim);color:var(--amber);}
  .badge.rejected,.badge.suspended{background:var(--red-dim);color:var(--red);}
  .when{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);}
  .ops{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
  .op{font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;
      border:1px solid var(--hairline);background:transparent;color:var(--text-muted);}
  .op:hover{background:var(--panel-2);color:var(--text);}
  .op.approve:hover{color:var(--teal);border-color:var(--teal);}
  .op.danger:hover{color:var(--red);border-color:var(--red);}
  .locked{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);}
  .bk-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px;}
  .bk-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--hairline);
          font-size:12.5px;align-items:baseline;flex-wrap:wrap;}
  .bk-row:last-child{border-bottom:none;}
  .bk-key{font-family:var(--mono);font-size:11.5px;white-space:nowrap;}
  .bk-meta{color:var(--text-muted);font-size:11.5px;}
  .bk-fresh{color:var(--teal);font-weight:600;}
  .bk-stale{color:var(--amber);font-weight:600;}
  .log{margin-top:26px;}
  .log h2{font-size:13px;font-family:var(--mono);letter-spacing:.06em;color:var(--text-muted);
          margin:0 0 10px;font-weight:600;}
  .log-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--hairline);
           font-size:12.5px;align-items:baseline;flex-wrap:wrap;}
  .log-row:last-child{border-bottom:none;}
  .log-when{font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap;}
  .log-who{color:var(--text-muted);}
  .log-what{color:var(--text);}
  .empty{padding:34px 20px;text-align:center;border:1px dashed #D2CDBB;border-radius:12px;
         font-family:var(--mono);font-size:12.5px;color:var(--text-dim);background:var(--panel);}
  /* 排程狀態與使用狀況。沿用備份那一區的色彩語彙（teal=好、amber=該看一下、
     red=壞了），讓三個維運區塊在同一頁上讀起來是同一套規則。 */
  .ops-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--hairline);
           font-size:12.5px;align-items:baseline;flex-wrap:wrap;}
  .ops-row:last-child{border-bottom:none;}
  .ops-name{font-weight:600;min-width:96px;}
  .ops-ok{color:var(--teal);font-weight:600;}
  .ops-warn{color:var(--amber);font-weight:600;}
  .ops-bad{color:var(--red);font-weight:600;}
  .ops-meta{color:var(--text-muted);font-size:11.5px;}
  .ops-err{font-family:var(--mono);font-size:11px;color:var(--red);width:100%;
           word-break:break-all;line-height:1.6;}
  .ops-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .ops-tbl th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
              color:var(--text-dim);text-transform:uppercase;padding:0 10px 7px 0;font-weight:600;}
  .ops-tbl td{padding:7px 10px 7px 0;border-top:1px solid var(--hairline);vertical-align:top;}
  .ops-tbl td.num{font-family:var(--mono);text-align:right;padding-right:14px;}
  /* 窄螢幕放不下就讓表格自己捲，不要把整頁撐寬 */
  .ops-scroll{overflow-x:auto;}
  .msg{margin-bottom:16px;padding:11px 13px;border-radius:8px;font-size:13px;display:none;}
  .msg.err{display:block;background:var(--red-dim);border:1px solid rgba(199,75,67,.3);color:var(--red);}
  .msg.ok{display:block;background:var(--teal-dim);border:1px solid rgba(31,140,104,.3);color:var(--teal);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Account Administration</div>
      <h1>帳號管理</h1>
    </div>
    <div class="actions">
      <span class="whoami" id="whoami">—</span>
      <button class="btn" id="btnBack" type="button">← 回排程</button>
      <button class="btn" id="btnLogout" type="button">登出</button>
    </div>
  </header>

  <div class="note">
    這裡只管理帳號，看不到任何人的排程內容。<br>
    停用或拒絕帳號會立即讓對方所有裝置登出，不需等待其重新登入。
  </div>

  <div class="msg" id="msg"></div>
  <div id="list"><div class="empty">載入中…</div></div>

  <div class="log">
    <div class="bk-head">
      <h2 style="margin:0">每日備份</h2>
      <button class="btn" id="btnBackupNow" type="button">立即備份一次</button>
    </div>
    <div id="backups"><div class="empty">載入中…</div></div>
  </div>

  <div class="log">
    <h2>排程狀態（每天台北時間早上 8 點）</h2>
    <div id="cron"><div class="empty">載入中…</div></div>
  </div>

  <div class="log">
    <h2>使用狀況</h2>
    <div id="usage"><div class="empty">載入中…</div></div>
  </div>

  <div class="log">
    <h2>管理者操作記錄（最近 200 筆）</h2>
    <div id="log"><div class="empty">載入中…</div></div>
  </div>
  <div class="signature">此系統由劉思妤設計、規劃、製作。</div>
</div>

<script>
(function(){
  var listEl = document.getElementById('list');
  var msgEl = document.getElementById('msg');
  var me = null;

  var msgTimer = null;
  function showMsg(t, kind, sticky){
    msgEl.textContent = t; msgEl.className = 'msg ' + kind;
    clearTimeout(msgTimer);
    // 臨時密碼這類「只顯示一次」的訊息不能 4 秒就消失，抄都來不及
    if (!sticky) msgTimer = setTimeout(function(){ msgEl.className = 'msg'; }, 4000);
  }

  function fmt(ts){
    if (!ts) return '—';
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' +
           String(d.getDate()).padStart(2,'0');
  }
  var STATUS_LABEL = { pending:'待核准', approved:'已核准', rejected:'已拒絕', suspended:'已停用' };
  var ROLE_LABEL = { admin:'管理者', user:'使用者' };

  async function api(path, opts){
    var r = await fetch(path, opts);
    var d = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    return d;
  }

  async function load(){
    try {
      me = await api('/api/auth/me');
      document.getElementById('whoami').textContent = me.email;
      var data = await api('/api/admin/users');
      render(data.users || []);
    } catch (e) {
      listEl.innerHTML = '';
      showMsg('讀取失敗：' + e.message, 'err');
    }
    // 操作記錄、備份與帳號清單各自獨立：其中一項讀不到不該讓整個管理頁變成錯誤畫面
    loadLog();
    loadBackups();
    opsLoadCron();
    opsLoadUsage();
  }

  async function loadBackups(){
    var el = document.getElementById('backups');
    try {
      var d = await api('/api/admin/backups');
      renderBackups(d);
    } catch (e) {
      el.innerHTML = '<div class="empty">備份狀態讀取失敗：' + esc(e.message) + '</div>';
    }
  }

  function renderBackups(d){
    var el = document.getElementById('backups');
    if (!d.configured) {
      el.innerHTML = '<div class="empty">尚未綁定備份儲存空間（R2）</div>';
      return;
    }
    if (!d.backups.length) {
      // 「還沒有備份」必須說得很明白。備份最可怕的失敗模式是「以為有、其實沒有」，
      // 所以這裡不能只是一片空白讓人自己猜。
      el.innerHTML = '<div class="empty">⚠️ 目前沒有任何備份。每天台北時間早上 8 點會自動產生一份；' +
        '想立刻確認能不能備份，按上面的「立即備份一次」。</div>';
      return;
    }

    // 最新一份是不是今天或昨天的？備份的價值在於「最近」，一份三週前的備份
    // 看起來也是綠燈，但它其實已經沒有在跑了——所以這裡要標出來。
    var today = ymdTaipei(Date.now());
    var newest = d.backups[0].key.replace('backup/', '').replace('.json', '');
    var fresh = newest >= ymdTaipei(Date.now() - 36 * 3600 * 1000);

    el.innerHTML =
      '<div class="bk-row"><span class="' + (fresh ? 'bk-fresh' : 'bk-stale') + '">' +
        (fresh ? '✓ 最新備份 ' + esc(newest) : '⚠️ 最新備份是 ' + esc(newest) + '，已經不是最近的了') +
      '</span><span class="bk-meta">共 ' + d.backups.length + ' 份，保留最近 ' + d.keep + ' 份' +
      (newest === today ? '（含今天）' : '') + '</span></div>' +
      d.backups.map(function(b){
        return '<div class="bk-row">' +
          '<span class="bk-key">' + esc(b.key.replace('backup/', '')) + '</span>' +
          '<span class="bk-meta">' + kb(b.size) + ' · ' + b.users + ' 個帳號 · ' + b.states + ' 份排程</span>' +
          '</div>';
      }).join('');
  }

  function kb(n){ return (n / 1024).toFixed(1) + ' KB'; }

  /** 台北時間的 YYYY-MM-DD。與伺服器端的備份檔名用同一個時區基準。 */
  function ymdTaipei(ms){ return new Date(ms + 8 * 3600 * 1000).toISOString().slice(0, 10); }

  document.getElementById('btnBackupNow').onclick = async function(){
    var btn = this;
    btn.disabled = true;
    var was = btn.textContent;
    btn.textContent = '備份中…';
    try {
      var d = await api('/api/admin/backups', { method: 'POST' });
      showMsg('備份完成：' + d.result.key + '（' + d.result.users + ' 個帳號、' +
              d.result.states + ' 份排程，' + kb(d.result.bytes) + '）', 'ok', true);
      loadBackups();
    } catch (e) {
      showMsg('備份失敗：' + e.message, 'err', true);
    } finally {
      btn.disabled = false;
      btn.textContent = was;
    }
  };

  // ===================== 排程狀態與使用狀況 =====================
  //
  // 這一整段存在的理由是一次真實事故：逾期提醒信整整兩週沒有寄出，而所有條件
  // 都成立（提醒開著、帳號 approved、確實有即將到期的項目）。系統沒有任何徵兆——
  // 寄信失敗只留了一行 console.warn，而那行字在 Cloudflare 後台，沒有人會去翻。
  //
  // 與備份那一區同一個判斷：**看得見的備份才是備份**，看不見的 cron 同樣不算在跑。
  //
  // 新增的頂層函式一律加 ops 前綴。這一段一次加了好幾個，而「頂層函式被區域變數
  // 遮蔽」在這個 repo 發生過兩次（見 CLAUDE.md 的〈多語系〉）——tests/shadow.test.mjs
  // 會擋，但取名時先避開比事後被擋下來省事。

  // 已知的三件排程工作。伺服器端刻意不寫死這份清單（新工作才不會靜靜地不被監看），
  // 而這裡要寫死，理由相反：**從未執行過的工作必須看得到**，而沒有記錄的東西
  // 不會自己出現在回應裡。多出來的步驟則照樣顯示，兩邊互補。
  var OPS_STEPS = [
    ['reminder', '逾期提醒信'],
    ['backup',   '每日備份'],
    ['purge',    '過期資料清理']
  ];

  // 幾小時內算「新鮮」。與備份那一區的 36 小時一致：cron 一天跑一次，
  // 留一點餘裕才不會因為執行時間前後飄移就誤報。
  var OPS_FRESH_MS = 36 * 3600 * 1000;

  async function opsLoadCron(){
    var el = document.getElementById('cron');
    try { opsRenderCron(await api('/api/admin/cron')); }
    catch (e) { el.innerHTML = '<div class="empty">排程狀態讀取失敗：' + esc(e.message) + '</div>'; }
  }

  function opsRenderCron(d){
    var el = document.getElementById('cron');
    var now = d.now || Date.now();
    var seen = {};
    var names = OPS_STEPS.slice();
    OPS_STEPS.forEach(function(p){ seen[p[0]] = 1; });
    Object.keys(d.steps || {}).forEach(function(k){ if (!seen[k]) names.push([k, k]); });

    var html = names.map(function(p){
      var key = p[0], label = p[1], st = (d.steps || {})[key];

      // 從未執行過 ≠ 執行成功。沒有記錄時要明說，不能留白讓人自己猜。
      if (!st) {
        return '<div class="ops-row"><span class="ops-name">' + esc(label) + '</span>' +
          '<span class="ops-warn">— 尚無記錄</span>' +
          '<span class="ops-meta">還沒跑過，或這是剛上線的第一天（記錄從部署後才開始累積）</span></div>';
      }

      // 真正要看的是**最後一次成功**，不是最後一次執行。「昨天跑過」與
      // 「昨天跑過但失敗了」在只有時間戳的清單裡看起來很像，意義卻相反。
      var fresh = st.lastOkAt != null && (now - st.lastOkAt) < OPS_FRESH_MS;
      var cls = fresh ? 'ops-ok' : (st.lastOkAt == null ? 'ops-bad' : 'ops-warn');
      var head = fresh ? '✓ 正常'
        : (st.lastOkAt == null ? '✗ 從來沒有成功過' : '⚠️ 最後成功：' + opsAgo(st.lastOkAt, now));

      var meta = '最後執行 ' + opsAgo(st.lastRunAt, now);
      if (st.lastOkAt != null && !fresh) meta += '（跑了，但沒成功）';

      return '<div class="ops-row">' +
        '<span class="ops-name">' + esc(label) + '</span>' +
        '<span class="' + cls + '">' + head + '</span>' +
        '<span class="ops-meta">' + esc(meta) + '</span>' +
        // 錯誤訊息是這整張表存在的理由：「金鑰失效」與「inbox 不存在」
        // 在一個 failed 數字底下看起來一模一樣，處理方向卻完全不同
        (st.lastError && !fresh ? '<span class="ops-err">最近的錯誤：' + esc(st.lastError) + '</span>' : '') +
        '</div>';
    }).join('');

    var runs = d.runs || [];
    if (runs.length) {
      html += '<div class="section-label">最近的執行記錄（保留 ' + (d.keepDays || 30) + ' 天）</div>' +
        runs.slice(0, 30).map(function(r){
          return '<div class="ops-row">' +
            '<span class="log-when">' + esc(opsStamp(r.startedAt)) + '</span>' +
            '<span class="' + (r.ok ? 'ops-ok' : 'ops-bad') + '">' + (r.ok ? '✓' : '✗') + '</span>' +
            '<span class="ops-name">' + esc(opsLabel(r.step)) + '</span>' +
            '<span class="ops-meta">' + esc(String(r.detail == null ? '' : r.detail).slice(0, 160)) +
            ' · ' + r.ms + 'ms</span></div>';
        }).join('');
    }
    el.innerHTML = html;
  }

  function opsLabel(step){
    for (var i = 0; i < OPS_STEPS.length; i++) if (OPS_STEPS[i][0] === step) return OPS_STEPS[i][1];
    return step;
  }

  /** 「14 天前」比一個時間戳好懂太多——要回答的問題本來就是「多久沒成功了」 */
  function opsAgo(ms, now){
    if (ms == null) return '—';
    var s = Math.max(0, Math.round((now - ms) / 1000));
    if (s < 90) return '剛剛';
    var m = Math.round(s / 60); if (m < 90) return m + ' 分鐘前';
    var h = Math.round(m / 60); if (h < 36) return h + ' 小時前';
    return Math.round(h / 24) + ' 天前';
  }

  function opsStamp(ms){
    var d = new Date(ms);
    return fmt(ms) + ' ' + String(d.getHours()).padStart(2,'0') + ':' +
           String(d.getMinutes()).padStart(2,'0');
  }

  async function opsLoadUsage(){
    var el = document.getElementById('usage');
    try { opsRenderUsage(await api('/api/admin/usage')); }
    catch (e) { el.innerHTML = '<div class="empty">使用狀況讀取失敗：' + esc(e.message) + '</div>'; }
  }

  function opsRenderUsage(d){
    var el = document.getElementById('usage');
    var users = d.users || [], t = d.totals || {}, now = d.now || Date.now();
    var today = ymdTaipei(now);

    var rows = users.map(function(u){
      // 提醒開著、卻很久沒寄成功——這一格就是那次事故在畫面上的樣子。
      // 「今天還沒寄」不算異常（沒事就不寄是刻意的設計），所以門檻放寬到 7 天。
      var stale = u.reminderOn && u.lastSentYmd &&
                  u.lastSentYmd < ymdTaipei(now - 7 * 86400000);
      var rem = !u.reminderOn ? '<span class="ops-meta">關閉</span>'
        : '<span class="' + (stale ? 'ops-warn' : 'ops-ok') + '">' +
          (stale ? '⚠️ 開啟，但最後寄出是 ' + esc(u.lastSentYmd) : '開啟') + '</span>' +
          // 已經在警示裡講過日期就不要再講一次；正常時才把它補在說明裡
          '<span class="ops-meta">（提前 ' + (u.leadDays == null ? 3 : u.leadDays) + ' 天' +
          (stale ? '' : (u.lastSentYmd
            ? '，最後寄出 ' + esc(u.lastSentYmd) + (u.lastSentYmd === today ? '（今天）' : '')
            : '，還沒寄過')) +
          '）</span>';

      return '<tr>' +
        '<td>' + esc(u.email) + '</td>' +
        '<td class="num">' + u.items + '</td>' +
        '<td class="num">' + u.gantt + '</td>' +
        '<td class="num">' + u.devices + '</td>' +
        '<td>' + (u.syncedAt ? esc(opsAgo(u.syncedAt, now)) : '<span class="ops-meta">從未同步</span>') + '</td>' +
        '<td>' + rem + '</td>' +
        '</tr>';
    }).join('');

    el.innerHTML =
      '<div class="ops-scroll"><table class="ops-tbl">' +
      '<thead><tr><th>帳號</th><th>項目</th><th>專案</th><th>裝置</th><th>最後同步</th><th>逾期提醒</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
      // 0 是有意義的數字，不是「沒資料」。這兩個功能做好之後一直沒有人用，
      // 而那件事原本要直接查資料庫才知道——看不到的訊號等於不存在。
      (d.ai ? '<div class="ops-row" style="margin-top:12px">' +
        '<span class="ops-name">AI 小幫手</span>' +
        (!d.ai.configured
          ? '<span class="ops-meta">尚未設定金鑰</span>'
          : '<span class="' + (d.ai.failed ? 'ops-warn' : 'ops-ok') + '">' +
            d.ai.calls + ' 次 / 30 天' + (d.ai.failed ? '（' + d.ai.failed + ' 次失敗）' : '') + '</span>' +
            // token 數是唯一看得到花費的地方。DeepSeek 的後台沒有人會每天去翻，
            // 而看不見的花費會失控——同〈看得見的備份才是備份〉
            '<span class="ops-meta">送出 ' + d.ai.promptTokens.toLocaleString() +
            ' / 回覆 ' + d.ai.completionTokens.toLocaleString() + ' tokens</span>') +
        '</div>' : '') +
      '<div class="ops-row" style="margin-top:12px">' +
        '<span class="ops-name">全站</span>' +
        '<span class="ops-meta">行事曆訂閱 ' + (t.ics || 0) + ' 筆 · ' +
        '跨帳號分享 ' + (t.shares || 0) + ' 筆 · ' +
        '共享操作記錄 ' + (t.shareActivity || 0) + ' 筆 · ' +
        '管理者操作記錄 ' + (t.adminActivity || 0) + ' 筆</span></div>';
  }

  async function loadLog(){
    var el = document.getElementById('log');
    try {
      var d = await api('/api/admin/activity');
      renderLog(d.activity || []);
    } catch (e) {
      el.innerHTML = '<div class="empty">操作記錄讀取失敗：' + esc(e.message) + '</div>';
    }
  }

  function renderLog(rows){
    var el = document.getElementById('log');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">目前沒有任何管理者操作記錄</div>';
      return;
    }
    // 這裡的內容全部來自伺服器（email 與伺服器自己算出的描述），但仍然逐一跳脫：
    // email 是使用者自己註冊時填的，把它直接塞進 innerHTML 就是一條注入路徑
    el.innerHTML = rows.map(function(r){
      return '<div class="log-row">' +
        '<span class="log-when">' + esc(formatWhen(r.created_at)) + '</span>' +
        '<span class="log-who">' + esc(r.actor_email) + ' → ' + esc(r.target_email) + '</span>' +
        '<span class="log-what">' + esc(r.action) + '</span>' +
        '</div>';
    }).join('');
  }

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // 不叫 when()：admin.html 內已經有 `var when = document.createElement('span')`，
  // 取同一個名字會讓那一段執行時丟 "when is not a function"。這正是 CLAUDE.md
  // 記過兩次的碰撞——而碰撞是新加的全域這一側造成的，不是既有區域變數的錯。
  function formatWhen(ms){
    var d = new Date(ms);
    var p = function(n){ return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render(users){
    listEl.innerHTML = '';
    if (!users.length) { listEl.innerHTML = '<div class="empty">目前沒有任何帳號</div>'; return; }

    var pending = users.filter(function(u){ return u.status === 'pending'; });
    var others = users.filter(function(u){ return u.status !== 'pending'; });

    if (pending.length) {
      listEl.appendChild(label('待核准（' + pending.length + '）'));
      pending.forEach(function(u){ listEl.appendChild(rowFor(u)); });
    }
    if (others.length) {
      listEl.appendChild(label('所有帳號'));
      others.forEach(function(u){ listEl.appendChild(rowFor(u)); });
    }
  }

  function label(text){
    var d = document.createElement('div');
    d.className = 'section-label'; d.textContent = text;
    return d;
  }

  function rowFor(u){
    var row = document.createElement('div');
    row.className = 'row' + (u.status === 'pending' ? ' pending' : '');

    var email = document.createElement('span');
    email.className = 'email'; email.textContent = u.email;
    row.appendChild(email);

    row.appendChild(badge(ROLE_LABEL[u.role] || u.role, u.role));
    row.appendChild(badge(STATUS_LABEL[u.status] || u.status, u.status));

    var when = document.createElement('span');
    when.className = 'when'; when.textContent = '註冊 ' + fmt(u.created_at);
    row.appendChild(when);

    var ops = document.createElement('div');
    ops.className = 'ops';

    if (me && u.id === me.id) {
      var self = document.createElement('span');
      self.className = 'locked'; self.textContent = '（你自己，無法變更）';
      ops.appendChild(self);
    } else {
      if (u.status !== 'approved') ops.appendChild(op('核准', 'approve', function(){ patch(u, { status:'approved' }); }));
      if (u.status === 'pending')  ops.appendChild(op('拒絕', 'danger',  function(){ patch(u, { status:'rejected' }); }));
      if (u.status === 'approved') ops.appendChild(op('停用', 'danger',  function(){ patch(u, { status:'suspended' }); }));
      ops.appendChild(op(u.role === 'admin' ? '降為使用者' : '設為管理者', '', function(){
        patch(u, { role: u.role === 'admin' ? 'user' : 'admin' });
      }));
      ops.appendChild(op('重設密碼', '', function(){ resetPw(u); }));
      ops.appendChild(op('刪除', 'danger', function(){ del(u); }));
    }
    row.appendChild(ops);
    return row;
  }

  function badge(text, kind){
    var b = document.createElement('span');
    b.className = 'badge ' + kind; b.textContent = text;
    return b;
  }

  function op(text, kind, fn){
    var b = document.createElement('button');
    b.className = 'op' + (kind ? ' ' + kind : '');
    b.textContent = text; b.onclick = fn;
    return b;
  }

  async function patch(u, changes){
    try {
      await api('/api/admin/users/' + encodeURIComponent(u.id), {
        method:'PATCH', headers:{'content-type':'application/json'}, body: JSON.stringify(changes)
      });
      showMsg(u.email + ' 已更新', 'ok');
      load();
    } catch (e) { showMsg('更新失敗：' + e.message, 'err'); }
  }

  async function del(u){
    if (!confirm('確定刪除「' + u.email + '」？\n該帳號的排程資料也會一併刪除，此操作無法復原。')) return;
    try {
      await api('/api/admin/users/' + encodeURIComponent(u.id), { method:'DELETE' });
      showMsg(u.email + ' 已刪除', 'ok');
      load();
    } catch (e) { showMsg('刪除失敗：' + e.message, 'err'); }
  }

  async function resetPw(u){
    if (!confirm('重設 ' + u.email + ' 的密碼？\n\n對方所有裝置會立即登出，舊密碼立刻失效。\n新的臨時密碼只會顯示一次，請抄下後轉交對方，並提醒登入後立即變更。')) return;
    try {
      var d = await api('/api/admin/users/' + encodeURIComponent(u.id) + '/reset-password', { method:'POST' });
      showMsg(d.email + ' 的臨時密碼：' + d.tempPassword + '（只顯示這一次，請立即抄下）', 'ok', true);
    } catch (e) { showMsg('重設失敗：' + e.message, 'err'); }
  }

  document.getElementById('btnBack').onclick = function(){ location.href = '/'; };
  document.getElementById('btnLogout').onclick = async function(){
    await fetch('/api/auth/logout', { method:'POST' });
    location.href = '/login';
  };

  load();
})();
</script>
</body>
</html>
