<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<script>
  // 與 index.html／login.html 共用同一個偏好鍵，暗色使用者不會被閃一下。
  (function(){
    var pref = null;
    try{ pref = localStorage.getItem('workSchedule.v1.theme'); }catch(e){}
    var dark = (pref === 'dark') || (pref !== 'light' &&
      window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<title>訂閱 Pro — 工作排程確認系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;600&display=swap"></noscript>
<style>
  /* 與 login.html／reset.html／unsub.html 同一組變數與元件樣式。 */
  :root{
    --bg:#F6F4EE; --panel:#FFFFFF; --panel-2:#F1EEE5;
    --hairline:#E4E0D3; --text:#2A2A26; --text-muted:#5F5E58; --text-dim:#6B6A63;
    --amber:#C9822E; --amber-dim:rgba(201,130,46,0.12);
    --amber-ink:#8A5716; --accent-fill:#A4651C;
    --disabled-fill:#A2A099;
    --teal:#1F8C68; --teal-dim:rgba(31,140,104,0.10);
    --red:#C74B43; --red-dim:rgba(199,75,67,0.10);
    --on-accent:#FFFDF9;
    --mono:'JetBrains Mono',monospace; --sans:'Noto Sans TC','Inter',sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#1A1917; --panel:#232220; --panel-2:#2B2A27;
    --hairline:#3A3833;
    --text:#E8E5DC; --text-muted:#A8A49A; --text-dim:#9A968C;
    --on-accent:#17160F;
    --amber:#E3A052; --amber-dim:rgba(227,160,82,0.16);
    --amber-ink:var(--amber); --accent-fill:var(--amber); --disabled-fill:#7A766D;
    --teal:#3FBF92; --teal-dim:rgba(63,191,146,0.14);
    --red:#E8756B; --red-dim:rgba(232,117,107,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--sans);
       display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--hairline);
        border-radius:14px;padding:28px 26px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  h1{margin:0 0 8px;font-size:21px;font-weight:700;}
  .lede{margin:0 0 18px;font-size:13px;line-height:1.7;color:var(--text-muted);}
  .plans{display:flex;gap:10px;margin-bottom:16px;}
  .plan{flex:1;padding:12px;border-radius:9px;border:1px solid var(--hairline);background:var(--panel-2);
        cursor:pointer;font-family:var(--sans);color:var(--text);text-align:left;font-size:13px;line-height:1.5;}
  .plan b{display:block;font-size:16px;}
  .plan[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-dim);}
  .terms{font-size:12.5px;line-height:1.7;color:var(--text-muted);margin:0 0 14px;}
  button.submit{width:100%;padding:12px;border:none;border-radius:9px;background:var(--accent-fill);
                color:var(--on-accent);font-family:var(--sans);font-size:14.5px;font-weight:700;cursor:pointer;}
  button.submit:disabled{background:var(--disabled-fill);cursor:not-allowed;}
  .msg{margin-top:16px;padding:11px 13px;border-radius:8px;font-size:13px;line-height:1.65;display:none;}
  .msg.err{display:block;background:var(--red-dim);border:1px solid rgba(199,75,67,.3);color:var(--red);}
  .msg.ok{display:block;background:var(--teal-dim);border:1px solid rgba(31,140,104,.3);color:var(--teal);}
  .foot{margin-top:22px;text-align:center;font-size:12px;color:var(--text-dim);line-height:1.8;}
  .foot a{color:var(--amber-ink);text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <h1>訂閱 Pro</h1>
  <p class="lede">大項目與專案都不限數量，AI 小幫手每天 20 次。網頁版與 iPhone app 是同一個帳號，在這裡訂閱，兩邊都會變成 Pro。</p>

  <div class="plans" role="group" aria-label="選擇方案">
    <button class="plan" type="button" id="planMonthly" aria-pressed="true"><b>US$10</b>每月</button>
    <button class="plan" type="button" id="planYearly" aria-pressed="false"><b>US$100</b>每年</button>
  </div>

  <!-- 自動續訂、怎麼取消、誰收錢：三件事在按下付款之前就要說清楚。 -->
  <p class="terms">訂閱會自動續訂，可隨時在「我的帳號 → 方案 → 管理訂閱」取消，取消後到期前仍可使用。付款由 Paddle（Paddle.com）代收並開立收據，實際金額可能依你所在地區加上稅金。</p>

  <button class="submit" type="button" id="btnPay">前往付款</button>
  <div class="msg" id="msg" role="status"></div>

  <div class="foot">
    <a href="/">回到工作排程</a> ·
    <a href="/terms.html" target="_blank" rel="noopener">使用條款</a> ·
    <a href="/privacy.html" target="_blank" rel="noopener">隱私權政策</a>
  </div>
</div>
<script>
(function(){
  // 結帳視窗是 Paddle 的 Paddle.js。**它只在這一頁載入**：index.html 維持零外部相依，
  // 付款這件事整個隔離在這一頁。不加 SRI 的理由同 Turnstile：Paddle 持續更新這支檔案、
  // 官方只提供固定網址，加 hash 會在它更新的那一刻讓結帳整個壞掉。
  var PADDLE_JS = 'https://cdn.paddle.com/paddle/v2/paddle.js';

  var params = new URLSearchParams(location.search);
  var interval = params.get('plan') === 'yearly' ? 'yearly' : 'monthly';
  var btnM = document.getElementById('planMonthly'), btnY = document.getElementById('planYearly');
  var btnPay = document.getElementById('btnPay'), msgEl = document.getElementById('msg');

  function pick(v){
    interval = v;
    btnM.setAttribute('aria-pressed', v === 'monthly' ? 'true' : 'false');
    btnY.setAttribute('aria-pressed', v === 'yearly' ? 'true' : 'false');
  }
  btnM.onclick = function(){ pick('monthly'); };
  btnY.onclick = function(){ pick('yearly'); };
  pick(interval);

  function say(text, kind){
    msgEl.textContent = text;
    msgEl.className = 'msg ' + (kind || 'err');
  }

  function loadPaddle(){
    if(window.Paddle) return Promise.resolve(window.Paddle);
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = PADDLE_JS;
      s.onload = function(){ window.Paddle ? resolve(window.Paddle) : reject(new Error('Paddle.js 沒有載入')); };
      s.onerror = function(){ reject(new Error('Paddle.js 載入失敗')); };
      document.head.appendChild(s);
    });
  }

  /** 付款完成之後，Paddle 的通知要幾秒才會到伺服器。等它到了再回去，畫面才會是 Pro。 */
  function waitForPro(tries){
    fetch('/api/state', { credentials: 'same-origin' }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(d && d.user && d.user.plan === 'pro'){
          say('Pro 已經開通，正在回到工作排程…', 'ok');
          setTimeout(function(){ location.href = '/'; }, 1200);
        }else if(tries > 0){
          setTimeout(function(){ waitForPro(tries - 1); }, 2000);
        }else{
          say('付款已收到。開通通常在一兩分鐘內完成，回到工作排程後重新整理即可看到 Pro。', 'ok');
        }
      })
      .catch(function(){ if(tries > 0) setTimeout(function(){ waitForPro(tries - 1); }, 2000); });
  }

  btnPay.onclick = function(){
    btnPay.disabled = true;
    say('', 'ok'); msgEl.className = 'msg';
    fetch('/api/plan/paddle/checkout', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ interval: interval })
    }).then(function(r){
      if(r.status === 401){ location.href = '/login'; return null; }
      return r.json().then(function(d){ return { status: r.status, d: d }; });
    }).then(function(res){
      if(!res) return;
      if(res.status === 409){ btnPay.disabled = false; say('這個帳號已經是 Pro，不需要再訂閱。'); return; }
      if(res.status !== 200 || !res.d.transactionId){
        btnPay.disabled = false;
        say((res.d && res.d.error) || '暫時無法開始結帳，請稍後再試。');
        return;
      }
      var d = res.d;
      return loadPaddle().then(function(P){
        if(d.environment === 'sandbox') P.Environment.set('sandbox');
        P.Initialize({
          token: d.clientToken,
          eventCallback: function(ev){
            if(!ev || !ev.name) return;
            if(ev.name === 'checkout.completed'){
              say('付款完成，正在開通 Pro…', 'ok');
              waitForPro(15);
            }else if(ev.name === 'checkout.closed'){
              btnPay.disabled = false;
            }
          }
        });
        P.Checkout.open({
          transactionId: d.transactionId,
          customer: d.email ? { email: d.email } : undefined,
          settings: { displayMode: 'overlay', variant: 'one-page' }
        });
      });
    }).catch(function(e){
      // 降級可以，沉默不行：原因要寫在畫面上
      console.error('checkout failed', e);
      btnPay.disabled = false;
      say('結帳視窗打不開（' + (e && e.message || e) + '）。請檢查網路，或關掉會擋第三方腳本的外掛後再試。');
    });
  };
})();
</script>
</body>
</html>
