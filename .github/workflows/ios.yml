# iOS app：在 GitHub 的 Mac 上打包、簽章、上傳到 App Store Connect。
# 原生 SwiftUI 版要手動選 native。tag 與 main CI 照舊只打包 Capacitor 版。
#
# 三種觸發：手動、推 ios-v* tag、以及 **main 的 CI 全綠之後自動跑**。
# 開發者沒有 Mac 也沒關係——Xcode 只在這台機器上，金鑰只活在這幾分鐘。
#
# 自動打包這件事原本是不做的，理由寫著「Mac runner 貴而且慢，不該每個 PR 都佔」。
# 「慢」仍然是真的（約 3 分鐘），但**「貴」這個前提已經過期**：這是公開 repo，GitHub
# 的標準 runner 對公開 repo 不計費。前提過期了，結論就要重算——這正是〈忘記密碼〉那節
# 記過的同一件事（「系統沒有寄信基礎設施」在接上 AgentMail 之後就不成立了）。
#
# 真正的代價不是錢而是**打出沒有人要的 build**，所以自動那一條有兩道閘門（見 decide job）：
#   1. **CI 必須全綠**——紅的 commit 不該變成手機上的 app。所以用 workflow_run 掛在 CI
#      後面，而不是直接 on.push：後者與 CI 並行，測試還沒跑完就開始打包了。
#   2. **這次真的動到 app 才打**——只有 public/index.html 會被塞進 app（見
#      mobile/scripts/prepare-www.mjs），改 Worker、改文件、改 login.html 都不必重打。
# 判斷放在一個 ubuntu 的小 job 裡，Mac runner 連開都不用開。
#
# 需要四個 repository secret（App Store Connect → 使用者和存取權 → 整合 → 團隊金鑰）：
#   ASC_KEY_ID        金鑰的 Key ID（10 碼）。**金鑰的角色必須是 Admin**：exportArchive 的
#                     雲端簽章要用雲端代管的發佈憑證，App Manager／Developer 金鑰會被拒絕
#                     （「You haven't been given access to cloud-managed distribution
#                     certificates」，第三次打包就是這樣紅的），而網頁上沒有地方能替金鑰
#                     單獨開這個權限，只有使用者帳號有那個勾選框。
#   ASC_ISSUER_ID     Issuer ID
#   ASC_API_KEY_P8    .p8 檔的完整內容（含 BEGIN/END 那兩行）
#   APPLE_TEAM_ID     開發者帳號的 Team ID（10 碼）
#
# 簽章走 Xcode 的自動簽章（-allowProvisioningUpdates 帶著 API 金鑰）：Apple 那邊沒有
# 憑證或描述檔會自己建，不必在任何一台 Mac 上手動匯出 .p12。
#
# archive 刻意「不簽章」，簽章整個留到 exportArchive 那一步。理由是兩次失敗：
#   1. 自動簽章的 archive 一律用「開發用」身分，而開發用描述檔必須綁至少一台實體裝置，
#      帳號裡沒有裝置就失敗（「Your team has no devices from which to generate a
#      provisioning profile」）。
#   2. 在 archive 硬指定 CODE_SIGN_IDENTITY="Apple Distribution" 會被 Xcode 拒絕
#      （「App is automatically signed for development, but a conflicting code signing
#      identity Apple Distribution has been manually specified」）。
# exportArchive（method=app-store-connect、signingStyle=automatic、-allowProvisioningUpdates）
# 自己會用「發佈用」身分重簽：不綁裝置，發佈憑證由 Xcode 雲端簽章代管，runner 上不需要
# 任何 .p12。上架只需要這一種簽章。
name: iOS

on:
  workflow_dispatch:
    inputs:
      app:
        description: iOS 版本
        type: choice
        options: [legacy, native]
        default: legacy
      upload:
        description: 上傳到 App Store Connect（false 只打包、把 .ipa 留成 artifact）
        type: boolean
        default: false
  push:
    tags: ['ios-v*']
  # main 的 CI 跑完就檢查一次。掛在 CI 後面而不是直接 on.push，是為了「CI 綠了才打包」——
  # workflow_run 拿得到那一次的結論，on.push 只會與 CI 並行。
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: ios-build
  cancel-in-progress: false   # 上傳到一半被砍會留下不確定的 build，排隊等前一次做完

jobs:
  decide:
    name: 判斷要不要打包
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      # workflow_run 觸發時，預設會 checkout 預設分支的最新狀態，而不是觸發那一次的 commit。
      # 一定要指名 head_sha，否則判斷的是別的東西。fetch-depth: 2 才看得到上一個 commit。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - id: check
        env:
          EV: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # 手動與 tag：使用者明講了要打包，不問任何條件
          if [ "$EV" != "workflow_run" ]; then
            echo "觸發方式是 $EV：一律打包"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::notice::main 的 CI 是 $CONCLUSION，不打包——紅的 commit 不該變成手機上的 app"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # PR 一律 squash 合併（見 CLAUDE.md），所以 main 上一個 commit 就是一次完整的改動。
          # 真的看不到上一個 commit 時**寧可打包**：漏打一次要等下一輪，多打一次只是浪費三分鐘。
          if ! git rev-parse --verify -q HEAD~1 >/dev/null; then
            echo "::notice::看不到上一個 commit，保險起見照打"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "這次動到的檔案："; echo "$CHANGED"
          # app 會內建 public/index.html、privacy.html 與 terms.html（見
          # mobile/scripts/prepare-www.mjs）。改 Worker、login/admin、sw.js 或文件不必重打；
          # 法律頁改動則必須重打，因為它們也會隨 app bundle 上架。
          if printf '%s\n' "$CHANGED" | grep -v '^mobile/native/' | grep -qE '^(public/(index|privacy|terms)\.html|mobile/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::這次沒有動到 app 內建的前端或 mobile/，不打包"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 打包並上傳
    needs: decide
    if: ${{ needs.decide.outputs.build == 'true' }}
    # macos-26 映像預設是 Xcode 26.x 正式版（見 actions/runner-images 的 README）。
    # 不要用 `xcode-27`：那是「預覽」映像，裡面只有 beta。beta 打的 build 上傳得了，
    # App Store Connect 卻會拒收——「Unsupported SDK or Xcode version … you need to use
    # the latest Release Candidates (RC)」（第五次打包就是這樣紅的，前面四關全過）。
    runs-on: macos-26
    timeout-minutes: 45
    env:
      IOS_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.app == 'native' && 'native' || 'legacy' }}
    steps:
      # 同 decide：workflow_run 觸發時要指名那一次的 commit，不然打包的是別的東西
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        if: env.IOS_APP == 'legacy'
        with:
          node-version: 22

      - name: 顯示工具版本
        run: |
          xcodebuild -version
          if [ "$IOS_APP" = legacy ]; then node --version; fi

      - name: 安裝 Capacitor（只在 mobile/，根目錄維持零相依）
        if: env.IOS_APP == 'legacy'
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: 產生 www 並同步到 Xcode 專案
        if: env.IOS_APP == 'legacy'
        working-directory: mobile
        run: npm run sync

      - name: 設定原生 Google 登入
        if: env.IOS_APP == 'native'
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_IOS_CLIENT_ID" ]; then
            echo "::notice::未設定 GOOGLE_IOS_CLIENT_ID，原生版會提供電子郵件與 Apple 登入。"
            exit 0
          fi
          if [[ ! "$GOOGLE_IOS_CLIENT_ID" =~ ^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::GOOGLE_IOS_CLIENT_ID 格式不符"
            exit 1
          fi
          client="${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          plist=mobile/native/Config/Info.plist
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string $GOOGLE_IOS_CLIENT_ID" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.googleusercontent.apps.$client" "$plist"

      - name: 寫入 App Store Connect API 金鑰
        # 放在 ~/private_keys：xcodebuild 與 altool 都會在這裡找 AuthKey_<KEY_ID>.p8
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_API_KEY_P8" || { echo "::error::缺少 secret ASC_API_KEY_P8"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "::error::缺少 secret ASC_KEY_ID"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: 決定 Xcode 專案與 build 號
        run: |
          if [ "$IOS_APP" = native ]; then
            echo 'IOS_PROJECT=mobile/native/WorkSchedule.xcodeproj' >> "$GITHUB_ENV"
            echo 'IOS_SCHEME=WorkSchedule' >> "$GITHUB_ENV"
          else
            VERSION=$(node -p "require('./mobile/package.json').version")
            echo "LEGACY_MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
            echo 'IOS_PROJECT=mobile/ios/App/App.xcodeproj' >> "$GITHUB_ENV"
            echo 'IOS_SCHEME=App' >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "$IOS_APP build ${{ github.run_number }}"

      - name: 封存 iOS App
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "::error::缺少 secret APPLE_TEAM_ID"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "::error::缺少 secret ASC_ISSUER_ID"; exit 1; }
          args=(CURRENT_PROJECT_VERSION="$BUILD_NUMBER")
          if [ "$IOS_APP" = legacy ]; then
            xcodebuild -resolvePackageDependencies -project "$IOS_PROJECT" -scheme "$IOS_SCHEME"
            args+=(MARKETING_VERSION="$LEGACY_MARKETING_VERSION" CODE_SIGN_STYLE=Manual
                   CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER=)
          else
            args+=(CODE_SIGNING_ALLOWED=NO)
          fi
          if ! xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            "${args[@]}" > "$RUNNER_TEMP/archive.log" 2>&1; then
            tail -80 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          grep -E 'warning: .*sign|ARCHIVE SUCCEEDED' "$RUNNER_TEMP/archive.log" || true
          test -d "$RUNNER_TEMP/App.xcarchive" || { echo "::error::archive 沒有產生，看上面的 log"; tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: 寫入原生版封存的發佈權限
        if: env.IOS_APP == 'native'
        run: |
          # Apple 登入與推播能力會讓 Xcode 在封存時要求開發描述檔。封存後加上 ad-hoc 簽章，
          # exportArchive 仍可讀到完整權限，正式的分發簽章由下一步依開發團隊重簽。
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/$IOS_SCHEME.app"
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements mobile/native/Config/Release.entitlements "$APP"

      # build 13／14 的 aps-environment 就是在這裡掉的，而當時沒有任何一關在看。
      # archive 原本完全不簽章（CODE_SIGNING_ALLOWED=NO），於是 entitlements 從來沒有被
      # 寫進去；exportArchive 重簽時是從 archive 身上讀「原本要求了什麼」，讀到空的就簽出
      # 一個沒有推播權限的 app——**打包綠、上傳成功、裝得起來**，只有手機真的註冊推播
      # 那一刻才會說「找不到有效的 aps-environment 授權字串」。
      #
      # 所以 archive 改成 **ad-hoc 簽章**（`-`）：它會把 entitlements 真的寫進去，而且
      # 不需要描述檔、不需要綁裝置、不需要 .p12——原本那三個 `CODE_SIGNING_*=NO` 是為了
      # 避開「開發用描述檔要綁裝置」與「conflicting provisioning settings」兩次失敗，
      # ad-hoc + Manual 同樣避得開（見 CLAUDE.md 那兩列）。正式簽章仍然只在 export。
      #
      # 這一步是**斷言而不是印出來就好**：印出來沒有人會看，而這個 bug 的全部代價就是
      # 「沒有人在看結果」。寧可擋下這次打包，也不要再上傳一個推播壞掉的 build。
      - name: 確認 archive 真的帶著 aps-environment
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/$IOS_SCHEME.app"
          ENT="$RUNNER_TEMP/archived.entitlements"
          test -d "$APP" || { echo "::error::archive 裡找不到 $APP"; exit 1; }
          codesign -d --entitlements :- "$APP" > "$ENT" 2>"$RUNNER_TEMP/codesign.err" || true
          echo "── 簽進 archive 的 entitlements ──"
          cat "$ENT" || true
          echo "── codesign 的 stderr ──"
          cat "$RUNNER_TEMP/codesign.err" || true
          grep -q 'aps-environment' "$ENT" || {
            echo "::error::archive 裡沒有 aps-environment——推播在真機上一定失敗（build 13／14 就是這樣）。上面印出來的就是這個 app 實際帶著的全部 entitlements"
            exit 1; }
          grep -A1 'aps-environment' "$ENT" | grep -q '<string>production</string>' || {
            echo "::error::archive 裡的 aps-environment 不是 production——TestFlight 的 token 會送錯一台 APNs（BadDeviceToken）"
            exit 1; }
          echo "✓ aps-environment = production，真的在 archive 裡"

      - name: 匯出 App Store Connect 版本
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 只有手動觸發才問 inputs；tag 與「CI 綠了」都是一律上傳。
          # 原本寫 `event_name == 'push' || inputs.upload`，workflow_run 走這條會變成 false。
          UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
        run: |
          # 原生版先取得正式簽章的 .ipa，驗過成品才上傳。
          DEST=export
          if [ "$IOS_APP" = legacy ] && [ "$UPLOAD" = true ]; then DEST=upload; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DEST}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "目的地：$DEST"
          ls -la "$RUNNER_TEMP/export" || true

      - name: 驗證原生版 .ipa 的簽章、權限與登入設定
        if: env.IOS_APP == 'native'
        run: |
          IPA="$RUNNER_TEMP/export/$IOS_SCHEME.ipa"
          test -f "$IPA"
          CHECK_DIR=$(mktemp -d "$RUNNER_TEMP/ios-check.XXXXXX")
          ditto -x -k "$IPA" "$CHECK_DIR"
          APP="$CHECK_DIR/Payload/$IOS_SCHEME.app"
          ENT="$CHECK_DIR/signed.entitlements"
          codesign --verify --strict "$APP"
          codesign -d --entitlements :- "$APP" > "$ENT"
          python3 - "$APP/Info.plist" "$ENT" <<'PY'
          import plistlib
          import re
          import sys

          with open(sys.argv[1], 'rb') as file:
              info = plistlib.load(file)
          with open(sys.argv[2], 'rb') as file:
              entitlements = plistlib.load(file)

          if info.get('CFBundleIdentifier') != 'com.bounceto.workschedule':
              sys.exit('::error::原生版的 Bundle ID 與既有 App 不符')
          if entitlements.get('aps-environment') != 'production':
              sys.exit('::error::正式簽章缺少 production APNs')
          if 'Default' not in entitlements.get('com.apple.developer.applesignin', []):
              sys.exit('::error::正式簽章缺少 Sign in with Apple')

          schemes = [scheme for url_type in info.get('CFBundleURLTypes', [])
                     for scheme in url_type.get('CFBundleURLSchemes', [])]
          if any(not re.fullmatch(r'[a-zA-Z][a-zA-Z0-9+.-]*', scheme) for scheme in schemes):
              sys.exit('::error::CFBundleURLSchemes 有無效的 URL scheme')
          google_id = info.get('GIDClientID')
          if google_id or any(scheme.startswith('com.googleusercontent.apps.') for scheme in schemes):
              if not re.fullmatch(r'[a-zA-Z0-9-]+\.apps\.googleusercontent\.com', google_id or ''):
                  sys.exit('::error::GIDClientID 不是有效的 Google iOS Client ID')
              if '.'.join(reversed(google_id.split('.'))) not in schemes:
                  sys.exit('::error::Google OAuth 的 URL scheme 必須對應 GIDClientID')
          print('✓ Bundle ID、APNs、Sign in with Apple 和 URL schemes 通過')
          PY

      - name: 上傳已驗證的原生版到 App Store Connect
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.app == 'native' && inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/$IOS_SCHEME.ipa" -t ios \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID"

      - name: 保留 .ipa（只打包不上傳時）
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: 清掉金鑰
        if: always()
        run: rm -rf ~/private_keys
