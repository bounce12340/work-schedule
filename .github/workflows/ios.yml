# iOS app：在 GitHub 的 Mac 上打包、簽章、上傳到 App Store Connect。
#
# 只在手動觸發或推 ios-v* tag 時跑：Mac runner 貴而且慢，不該每個 PR 都佔。
# 開發者沒有 Mac 也沒關係——Xcode 只在這台機器上，金鑰只活在這幾分鐘。
#
# 需要四個 repository secret（App Store Connect → 使用者和存取權 → 整合 → 團隊金鑰）：
#   ASC_KEY_ID        金鑰的 Key ID（10 碼）
#   ASC_ISSUER_ID     Issuer ID
#   ASC_API_KEY_P8    .p8 檔的完整內容（含 BEGIN/END 那兩行）
#   APPLE_TEAM_ID     開發者帳號的 Team ID（10 碼）
#
# 簽章走 Xcode 的自動簽章（-allowProvisioningUpdates 帶著 API 金鑰）：Apple 那邊沒有
# 憑證或描述檔會自己建，不必在任何一台 Mac 上手動匯出 .p12。
name: iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 上傳到 App Store Connect（false 只打包、把 .ipa 留成 artifact）
        type: boolean
        default: true
  push:
    tags: ['ios-v*']

concurrency:
  group: ios-build
  cancel-in-progress: false   # 上傳到一半被砍會留下不確定的 build，排隊等前一次做完

jobs:
  build:
    name: 打包並上傳
    # GitHub 提供的 Xcode 27 映像（見 actions/runner-images 的 README）
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 顯示工具版本
        run: |
          xcodebuild -version
          node --version

      - name: 安裝 Capacitor（只在 mobile/，根目錄維持零相依）
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: 產生 www 並同步到 Xcode 專案
        working-directory: mobile
        run: npm run sync

      - name: 寫入 App Store Connect API 金鑰
        # 放在 ~/private_keys：xcodebuild 與 altool 都會在這裡找 AuthKey_<KEY_ID>.p8
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_API_KEY_P8" || { echo "::error::缺少 secret ASC_API_KEY_P8"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "::error::缺少 secret ASC_KEY_ID"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: 決定版本號與 build 號
        # 版本從 mobile/package.json 讀，build 號用 run_number：永不重複、不必手動加
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "版本 $VERSION（build ${{ github.run_number }}）"

      - name: 打包（xcodebuild archive，自動簽章）
        working-directory: mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "::error::缺少 secret APPLE_TEAM_ID"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "::error::缺少 secret ASC_ISSUER_ID"; exit 1; }
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error|warning: .*sign|Archive Succeeded|BUILD" || true
          test -d "$RUNNER_TEMP/App.xcarchive" || { echo "::error::archive 沒有產生，看上面的 log"; tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: 匯出並上傳到 App Store Connect
        working-directory: mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          DEST=$([ "$UPLOAD" = "true" ] && echo upload || echo export)
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DEST}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "目的地：$DEST"
          ls -la "$RUNNER_TEMP/export" || true

      - name: 保留 .ipa（只打包不上傳時）
        if: ${{ github.event_name != 'push' && !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: 清掉金鑰
        if: always()
        run: rm -rf ~/private_keys
